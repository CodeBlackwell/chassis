[project]
name = "chassis"
version = "0.0.1"
description = "A flexible, contracts-first base repo for sophisticated multi-agent projects."
requires-python = ">=3.11"
dependencies = [
    "pyyaml",        # profile loading
    "python-dotenv", # .env -> env vars for the live-pivot overrides
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib", "app", "config"]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.15",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["lib", "app", "config", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["lib", "app", "config"]
