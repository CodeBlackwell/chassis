# Zero-service, no-key offline profile: local Ollama + in-process FAISS.
llm:         {impl: ollama, model: "llama3.1:8b"}
embedder:    {impl: minilm, model: sentence-transformers/all-MiniLM-L6-v2}
vectorstore: {impl: faiss}           # pure lib, no service
ingestion:   {chunk_size: 800, overlap: 120}
retrieval:   {k: 5}
memory:      {window: 8, recall_k: 3}
